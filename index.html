<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>DISC 增員攻心術</title>
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
<main id="app" aria-label="DISC 增員攻心術互動網站">
  <section id="stage" class="stage" aria-live="polite">
    <img id="pageImage" class="page-image" src="assets/home.webp?v=16" alt="DISC 增員攻心術首頁" draggable="false" decoding="async">
    <div id="hotspots" class="hotspots"></div>
    <div id="fingerOverlays" class="finger-overlays" aria-hidden="true">
      <img class="finger tiger" src="assets/finger_tiger.webp?v=16" alt="" draggable="false">
      <img class="finger peacock" src="assets/finger_peacock.webp?v=16" alt="" draggable="false">
      <img class="finger koala" src="assets/finger_koala.webp?v=16" alt="" draggable="false">
      <img class="finger owl" src="assets/finger_owl.webp?v=16" alt="" draggable="false">
    </div>
    <div id="menuFingerOverlays" class="menu-finger-overlays" aria-hidden="true">
      <img class="menu-finger zone1" alt="" draggable="false">
      <img class="menu-finger zone2" alt="" draggable="false">
      <img class="menu-finger zone3" alt="" draggable="false">
    </div>
    <div id="sparkleOverlay" class="sparkle-overlay" aria-hidden="true">
      <span class="sparkle s1"></span><span class="sparkle s2"></span><span class="sparkle s3"></span>
      <span class="sparkle s4"></span><span class="sparkle s5"></span><span class="sparkle s6"></span>
      <span class="sparkle s7"></span><span class="sparkle s8"></span>
    </div>
    <button id="musicControl" class="music-control" type="button" aria-label="關閉背景音樂">♫</button>
    <audio id="bgm" loop autoplay preload="auto"></audio>
    <div id="loading" class="loading" aria-hidden="true"><span></span></div>
  </section>
</main>
<script src="js/script.js?v=16" defer></script>
</body>
</html>
